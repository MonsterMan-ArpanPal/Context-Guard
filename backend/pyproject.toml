[project]
name = "contextguard"
version = "0.1.0"
description = "Inference-time security proxy defending RAG pipelines against indirect prompt injection."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.2",
    "torch>=2.4,<2.8",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pypdf>=5.1",
    "fpdf2>=2.8",
    "groq>=0.13",
]

[dependency-groups]
dev = ["ruff>=0.7"]

# ContextGuard runs CPU inference only; pulling the default torch wheel would drag
# in ~4 GB of CUDA runtime. Pin torch to PyTorch's CPU-only index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
